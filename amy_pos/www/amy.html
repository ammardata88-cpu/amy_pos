<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>AMY</title>
<link rel="icon" href="/assets/amy_pos/images/logo.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#0E1726;--ink2:#334155;--mut:#64748B;--line:#E6EAF0;--bg:#F5F7FA;--card:#fff;
--side:#0B1A2B;--side2:#13263C;--brand:#0E9CC0;--brand-d:#0A7C99;--brand-l:#E3F6FB;
--ok:#12805C;--okb:#E7F6EF;--warn:#A15C07;--warnb:#FEF3DC;--bad:#B42318;--badb:#FDECEA;
--f:"IBM Plex Sans Arabic","Segoe UI",Tahoma,system-ui,sans-serif}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:var(--f);background:var(--bg);color:var(--ink);font-size:14.5px;line-height:1.65;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
a{color:inherit;text-decoration:none}
button{font-family:inherit}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
.hide{display:none!important}

/* shell */
.shell{display:flex;min-height:100vh}
.side{width:264px;flex:none;background:var(--side);color:#A9B8CB;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;z-index:30;transition:width .18s}
.sh{display:flex;align-items:center;gap:10px;padding:16px 16px 12px}
.sh .logo{display:flex;align-items:center;gap:11px;color:#fff;min-width:0;flex:1}
.sh .logo img{width:36px;height:36px;border-radius:10px;flex:none}
.sh .logo b{font-size:19px;font-weight:700;letter-spacing:.2px;display:block;line-height:1.2}
.sh .logo small{display:block;font-size:12px;color:#7F92A9;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:140px}
.rail-btn{background:none;border:0;color:#7F92A9;cursor:pointer;padding:6px;border-radius:8px}
.rail-btn:hover{background:var(--side2);color:#fff}
.nav{padding:6px 12px 16px;flex:1;overflow-y:auto}
.ni,.gh{position:relative;display:flex;align-items:center;gap:12px;width:100%;border:0;background:none;color:inherit;font-size:14.5px;font-weight:500;padding:9px 12px;border-radius:10px;cursor:pointer;text-align:start;margin-bottom:2px}
.ni:hover,.gh:hover{background:var(--side2);color:#fff}
.ni.on{background:rgba(14,156,192,.18);color:#5FD3F0}
.ni.on::before{content:"";position:absolute;inset-inline-start:-12px;top:8px;bottom:8px;width:3px;border-radius:3px;background:#5FD3F0}
.gh .chev{margin-inline-start:auto;width:16px;height:16px;transition:transform .15s}
.grp.open>.gh .chev{transform:rotate(180deg)}
.grp.open>.gh{color:#fff}
.sub{display:none;margin:2px 0 8px;padding-inline-start:22px}
.grp.open .sub{display:block}
.sub .ni{font-size:13.5px;padding:7px 12px;font-weight:400}
.sub .ni::after{content:"";width:5px;height:5px;border-radius:50%;background:currentColor;opacity:.35;order:-1;margin-inline-end:-2px}
.sf{padding:14px 18px;border-top:1px solid rgba(255,255,255,.08);font-size:12px;color:#6B7F96}
body.rail .side{width:74px}
body.rail .sh .logo span,body.rail .gh span,body.rail .ni span,body.rail .gh .chev,body.rail .sub,body.rail .sf{display:none}
body.rail .sh{flex-direction:column;padding:14px 0}
body.rail .gh,body.rail .ni{justify-content:center;padding:11px 0}
body.rail .rail-btn svg{transform:scaleX(-1)}

.right{flex:1;min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.94);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top .in{height:62px;padding:0 24px;display:flex;align-items:center;gap:10px}
.top h3{margin:0;font-size:18px;font-weight:600}
.sp{flex:1}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:10px;padding:9px 16px;font-size:14px;font-weight:600;cursor:pointer;white-space:nowrap;line-height:1.4;transition:background .12s}
.btn.p{background:var(--brand);color:#fff}.btn.p:hover{background:var(--brand-d)}
.btn.g{background:#fff;color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}.btn.g:hover{background:#F8FAFC}
.btn svg.i{width:17px;height:17px}
.menu{position:relative}
.pop{position:absolute;inset-inline-end:0;top:calc(100% + 8px);min-width:210px;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 32px -8px rgba(14,23,38,.18);padding:6px;display:none;z-index:40}
.menu.open .pop{display:block}
.pop button{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;padding:9px 12px;border-radius:8px;font-size:14px;cursor:pointer;color:var(--ink);text-align:start}
.pop button:hover{background:var(--bg)}
.pop hr{border:0;border-top:1px solid var(--line);margin:6px 0}
.av{width:36px;height:36px;border-radius:50%;background:var(--brand-l);color:var(--brand-d);display:grid;place-items:center;font-weight:700;border:0;cursor:pointer;font-size:15px}
#menuBtn{display:none}
.frame{flex:1;border:0;width:100%;min-height:calc(100vh - 62px);background:#fff}
.scrim{display:none}

/* page */
main{padding:26px 28px 56px;width:100%;max-width:1320px;margin:0 auto}
.hello{margin-bottom:20px}
.hello h1{margin:0;font-size:25px;font-weight:700;letter-spacing:-.2px}
.hello p{margin:2px 0 0;color:var(--mut)}
.err{background:var(--badb);color:var(--bad);border-radius:10px;padding:12px 16px;margin-bottom:16px;font-weight:500}
.gd{display:grid;gap:16px}
.k4{grid-template-columns:repeat(4,1fr)}
.c21{grid-template-columns:2fr 1fr;margin-top:16px}
.c11{grid-template-columns:1fr 1fr;margin-top:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;min-width:0}
.card h2{margin:0 0 14px;font-size:15.5px;font-weight:600;display:flex;align-items:center;justify-content:space-between;gap:10px}
.card h2 a{font-size:13px;font-weight:500;color:var(--brand-d);cursor:pointer}
.kpi{display:flex;flex-direction:column;gap:2px}
.kpi .top2{display:flex;align-items:center;justify-content:space-between}
.kpi .l{color:var(--mut);font-size:13.5px;font-weight:500}
.chip{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;background:var(--brand-l);color:var(--brand-d)}
.chip svg.i{width:18px;height:18px}
.kpi .v{font-size:26px;font-weight:700;letter-spacing:-.4px;margin-top:6px;direction:ltr;text-align:start;unicode-bidi:plaintext}
.kpi .v small{font-size:13px;font-weight:500;color:var(--mut);margin-inline-start:5px;letter-spacing:0}
.kpi .c{color:var(--mut);font-size:13px}
.big{display:flex;align-items:baseline;gap:22px;flex-wrap:wrap;margin-bottom:6px}
.big .n{font-size:30px;font-weight:700;letter-spacing:-.5px;direction:ltr}
.big .n small{font-size:14px;font-weight:500;color:var(--mut);margin-inline-start:6px}
.big .t{color:var(--mut);font-size:13px}
.areawrap{position:relative;height:220px;margin-top:6px}
.areawrap svg{width:100%;height:190px;display:block;overflow:visible}
.xl{display:flex;justify-content:space-between;color:var(--mut);font-size:12px;direction:ltr;margin-top:4px}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:#fff;border-radius:8px;padding:5px 10px;font-size:12.5px;white-space:nowrap;transform:translate(-50%,-110%);display:none;direction:ltr}
.split{margin:6px 0 18px}
.split .row{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
.split .row b{font-size:19px;direction:ltr}
.meter{height:8px;border-radius:8px;background:var(--line);overflow:hidden}
.meter i{display:block;height:100%;border-radius:8px}
.tbl{width:100%;border-collapse:collapse}
.tbl th{font-weight:500;color:var(--mut);font-size:12.5px;text-align:start;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:12px 10px;border-bottom:1px solid #EEF1F5;vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl tbody tr{cursor:pointer}.tbl tbody tr:hover{background:#F8FAFC}
.tbl .num{direction:ltr;text-align:start;font-weight:600;white-space:nowrap}
.tbl .mut{color:var(--mut);font-size:13px;white-space:nowrap}
.scroll{overflow-x:auto}
.pill{display:inline-block;border-radius:99px;padding:2px 11px;font-size:12.5px;font-weight:600;white-space:nowrap;background:#EEF1F5;color:#475467}
.pill.ok{background:var(--okb);color:var(--ok)}.pill.warn{background:var(--warnb);color:var(--warn)}.pill.bad{background:var(--badb);color:var(--bad)}
.donutw{display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.donut{position:relative;width:140px;height:140px;flex:none}
.donut svg{width:140px;height:140px;transform:rotate(-90deg)}
.donut .mid{position:absolute;inset:0;display:grid;place-items:center;text-align:center;line-height:1.2}
.donut .mid b{font-size:24px;font-weight:700}.donut .mid span{font-size:12px;color:var(--mut)}
.leg{list-style:none;margin:0;padding:0;flex:1;min-width:140px}
.leg li{display:flex;align-items:center;gap:8px;padding:5px 0;font-size:13.5px}
.leg i{width:10px;height:10px;border-radius:3px;flex:none}
.leg b{margin-inline-start:auto;direction:ltr}
.hb{list-style:none;margin:0;padding:0}
.hb li{padding:9px 0}
.hb .r{display:flex;justify-content:space-between;gap:10px;margin-bottom:6px;font-weight:500}
.hb .r span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hb .r .num{direction:ltr;font-weight:600;white-space:nowrap}
.empty{color:var(--mut);padding:18px 0;text-align:center}
@media(max-width:1100px){.k4{grid-template-columns:repeat(2,1fr)}.c21,.c11{grid-template-columns:1fr}}
@media(max-width:900px){
 .side{position:fixed;top:0;bottom:0;inset-inline-start:-290px;height:100%;transition:inset-inline-start .2s}
 body.nav-open .side{inset-inline-start:0}
 body.nav-open .scrim{display:block;position:fixed;inset:0;background:rgba(10,20,35,.45);z-index:25}
 body.rail .side{width:264px}
 body.rail .sh .logo span,body.rail .gh span,body.rail .ni span,body.rail .gh .chev,body.rail .sf{display:revert}
 body.rail .sub{display:none}body.rail .grp.open .sub{display:block}
 body.rail .sh{flex-direction:row;padding:16px 16px 12px}body.rail .gh,body.rail .ni{justify-content:flex-start;padding:9px 12px}
 .rail-btn{display:none}#menuBtn{display:inline-flex}
 main{padding:18px 16px 48px}.top .in{padding:0 14px}#fullBtn,#newTxt,#posTxt{display:none}
 .k4{grid-template-columns:1fr 1fr}.kpi .v{font-size:21px}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="shell">
<aside class="side">
 <div class="sh"><a class="logo" href="#home"><img src="/assets/amy_pos/images/logo.svg" alt=""><span><b>AMY</b><small id="company"></small></span></a>
  <button class="rail-btn" id="railBtn" type="button" aria-label="toggle"><svg class="i" viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg></button></div>
 <nav class="nav" id="nav"></nav><div class="sf">AMY by AMY Tech</div>
</aside>
<div class="scrim" id="scrim"></div>
<div class="right">
<header class="top"><div class="in">
 <button class="btn g" id="menuBtn" type="button" aria-label="menu"><svg class="i" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
 <h3 id="ptitle"></h3><span class="sp"></span>
 <div class="menu" id="newMenu"><button class="btn p" type="button" id="newBtn"><svg class="i" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg><span id="newTxt"></span></button><div class="pop" id="newPop"></div></div>
 <a class="btn g hide" id="posTop" href="/pos"><svg class="i" viewBox="0 0 24 24"><circle cx="9" cy="20" r="1.4"/><circle cx="18" cy="20" r="1.4"/><path d="M2 3h3l2.5 12h11L21 7H6"/></svg><span id="posTxt"></span></a>
 <button class="btn g" id="lang" type="button">EN</button>
 <div class="menu" id="uMenu"><button class="av" id="uBtn" type="button"></button>
  <div class="pop"><button id="fullBtn2" type="button"></button><hr><button id="outBtn" type="button"></button></div></div>
</div></header>
<iframe class="frame hide" id="frame" title="AMY"></iframe>
<main>
 <div id="err" class="err hide"></div>
 <div class="hello"><h1 id="hi"></h1><p id="date"></p></div>
 <section class="gd k4" id="kpis"></section>
 <section class="gd c21">
  <div class="card"><h2 id="tChart"></h2><div class="big" id="bigs"></div><div class="areawrap" id="area"></div></div>
  <div class="card"><h2 id="tDebt"></h2><div id="debt"></div></div>
 </section>
 <section class="gd c21">
  <div class="card"><h2><span id="tRecent"></span><a id="allInv"></a></h2><div class="scroll"><table class="tbl"><thead id="rh"></thead><tbody id="recent"></tbody></table></div></div>
  <div class="card" id="zcard"><h2 id="tZ"></h2><div id="zbody"></div></div>
 </section>
 <section class="gd c11">
  <div class="card"><h2 id="tTop"></h2><ul class="hb" id="top"></ul></div>
  <div class="card"><h2 id="tLow"></h2><div class="scroll"><table class="tbl"><tbody id="low"></tbody></table></div></div>
 </section>
</main>
</div></div>

function areaChart(series){

 var W=600,H=190,P=8, max=Math.max.apply(null,series.map(function(x){return x.total}).concat([1]));
 var pts=series.map(function(x,i){return [P+i*(W-2*P)/(series.length-1), H-P-(x.total/max)*(H-2*P-14)]});
 var d="M"+pts[0][0]+","+pts[0][1];
 for(var i=1;i<pts.length;i++){var mx=(pts[i-1][0]+pts[i][0])/2; d+=" C"+mx+","+pts[i-1][1]+" "+mx+","+pts[i][1]+" "+pts[i][0]+","+pts[i][1]}
 var svg=svgEl("svg",{viewBox:"0 0 "+W+" "+H,preserveAspectRatio:"none"});
 var defs=svgEl("defs",{}), gr=svgEl("linearGradient",{id:"ag",x1:"0",y1:"0",x2:"0",y2:"1"});
 gr.appendChild(svgEl("stop",{offset:"0","stop-color":"#0E9CC0","stop-opacity":".28"})); gr.appendChild(svgEl("stop",{offset:"1","stop-color":"#0E9CC0","stop-opacity":"0"}));
 defs.appendChild(gr); svg.appendChild(defs);
 [0.25,0.5,0.75,1].forEach(function(f){svg.appendChild(svgEl("line",{x1:0,x2:W,y1:H-P-f*(H-2*P-14),y2:H-P-f*(H-2*P-14),stroke:"#EEF1F5","stroke-width":1,"vector-effect":"non-scaling-stroke"}))});
 svg.appendChild(svgEl("path",{d:d+" L"+pts[pts.length-1][0]+","+H+" L"+pts[0][0]+","+H+" Z",fill:"url(#ag)"}));
 svg.appendChild(svgEl("path",{d:d,fill:"none",stroke:"#0E9CC0","stroke-width":2.5,"stroke-linecap":"round","vector-effect":"non-scaling-stroke"}));
 box.appendChild(svg);
 var xl=el("div","xl"); [0,4,8,13].forEach(function(i){xl.appendChild(el("span","",series[i].date.slice(5)))}); box.appendChild(xl);
 var tip=el("div","tip"); box.appendChild(tip);
 svg.addEventListener("mousemove",function(e){
  var r=svg.getBoundingClientRect(), rel=(e.clientX-r.left)/r.width, i=Math.round(rel*(series.length-1)); i=Math.max(0,Math.min(series.length-1,i));
  tip.style.display="block"; tip.style.left=(pts[i][0]/W*r.width)+"px"; tip.style.top=(pts[i][1]/H*r.height+6)+"px";
  tip.textContent=series[i].date+"  ·  "+money(series[i].total)+" "+cur();
 });
 svg.addEventListener("mouseleave",function(){tip.style.display="none"});
}
