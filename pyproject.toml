[project]
name = "amy_pos"
authors = [
    { name = "AMY Tech", email = "info@amytech.net" }
]
description = "AMY POS - a focused ERPNext distribution: Point of Sale, Purchasing and Warehouses with Saudi ZATCA e-invoicing"
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = []

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.bench.frappe-dependencies]
frappe = ">=15.0.0,<16.0.0"
erpnext = ">=15.0.0,<16.0.0"
